name: Python and Home Assistant tests
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - home-assistant: "2026.3.1"
            test-plugin: "0.13.317"
          - home-assistant: "2026.10.1"
            test-plugin: "0.13.372"
    name: HA ${{ matrix.home-assistant }} / Python 3.14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install pytest-homeassistant-custom-component==${{ matrix.test-plugin }} ruff==0.17.0
      - run: python -m ruff check .
      - run: python -m ruff format --check .
      - run: python -m pytest -q
